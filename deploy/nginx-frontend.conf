# =====================================================================
#  Post Generator — configuration nginx du SERVEUR FRONTAL
#
#  Topologie visée :
#     Internet  ->  nginx (serveur frontal, TLS)  ->  VM Ubuntu:8000 (uvicorn)
#
#  Aucun Apache ni nginx n'est nécessaire SUR la VM : uvicorn écoute
#  directement, et nginx fait déjà office de reverse proxy.
#
#  Installation (sur le serveur frontal, pas sur la VM) :
#    sudo cp nginx-frontend.conf /etc/nginx/sites-available/post-generator
#    sudo nano /etc/nginx/sites-available/post-generator   # adapter server_name + IP
#    sudo ln -s /etc/nginx/sites-available/post-generator /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

server {
    listen 80;
    server_name socialnetwork.coppelis.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name socialnetwork.coppelis.com;

    ssl_certificate     /etc/nginx/ssl/coppelis2025.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard-coppelis-2025.key;

    access_log /var/log/nginx/socialnetwork-access.log;
    error_log  /var/log/nginx/socialnetwork-error.log;

    # Génération d'images/vidéos par IA : le corps peut être volumineux
    client_max_body_size 100M;

    location / {
        # proxy_pass direct vers la VM — pas de bloc upstream
        proxy_pass http://192.168.150.130:8000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # -------------------------------------------------------------
        #  IP réelle du client — À NE PAS OMETTRE
        #
        #  Le verrouillage anti-brute-force de la page de connexion
        #  s'appuie sur le couple (email, adresse IP). Sans ces en-têtes,
        #  toutes les tentatives paraîtraient venir de l'IP du frontal :
        #  un seul attaquant bloquerait la connexion de tout le monde.
        # -------------------------------------------------------------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # La génération IA et le rendu vidéo dépassent largement les 60 s
        # par défaut : sans cela, un 504 tombe en pleine génération.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Réponses renvoyées telles quelles (pas de mise en tampon)
        proxy_buffering off;
    }

    # Fichiers statiques : servis par la VM, mais mis en cache par nginx.
    # Cache court car CSS/JS changent à chaque déploiement.
    location /static/ {
        proxy_pass http://192.168.150.130:8000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 5m;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
