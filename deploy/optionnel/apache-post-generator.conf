# =====================================================================
#  Post Generator — VirtualHost Apache (reverse proxy vers uvicorn)
#
#  Installation :
#    sudo cp deploy/apache-post-generator.conf /etc/apache2/sites-available/post-generator.conf
#    sudo nano /etc/apache2/sites-available/post-generator.conf   # adapter ServerName + chemins
#    sudo a2enmod proxy proxy_http headers rewrite ssl remoteip
#    sudo a2ensite post-generator
#    sudo apache2ctl configtest && sudo systemctl reload apache2
#
#  Certificat HTTPS (Let's Encrypt) :
#    sudo apt install certbot python3-certbot-apache
#    sudo certbot --apache -d post.example.com
#  Certbot complète automatiquement le bloc :443 ci-dessous.
# =====================================================================

<VirtualHost *:80>
    ServerName post.example.com

    # Laisse passer la validation ACME de Let's Encrypt
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    # Tout le reste bascule en HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>


<VirtualHost *:443>
    ServerName post.example.com

    SSLEngine on
    # Chemins renseignés automatiquement par certbot --apache
    SSLCertificateFile      /etc/letsencrypt/live/post.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/post.example.com/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/post-generator-error.log
    CustomLog ${APACHE_LOG_DIR}/post-generator-access.log combined

    # -----------------------------------------------------------------
    #  IP réelle du client
    #
    #  CRITIQUE : le verrouillage anti-brute-force de la page de connexion
    #  s'appuie sur le couple (email, adresse IP). Sans ces en-têtes,
    #  toutes les tentatives sembleraient venir de 127.0.0.1 et un seul
    #  attaquant bloquerait la connexion de tous les utilisateurs.
    # -----------------------------------------------------------------
    RemoteIPHeader X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # -----------------------------------------------------------------
    #  Fichiers statiques servis directement par Apache (plus rapide)
    #  Adapter le chemin au répertoire réel du projet.
    # -----------------------------------------------------------------
    Alias /static /home/ubuntu/post_generator/static
    <Directory /home/ubuntu/post_generator/static>
        Require all granted
        Options -Indexes
        # Le CSS/JS change à chaque déploiement : cache court pour éviter
        # d'avoir à vider le cache navigateur après une mise à jour.
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=300, must-revalidate"
        </IfModule>
    </Directory>
    ProxyPass /static !

    # -----------------------------------------------------------------
    #  Reverse proxy vers uvicorn
    # -----------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off

    # Génération IA, upload et rendu vidéo peuvent être longs :
    # 300 s évite un 504 en plein milieu d'une génération.
    ProxyTimeout 300

    ProxyPass        / http://127.0.0.1:8000/ timeout=300 retry=0
    ProxyPassReverse / http://127.0.0.1:8000/

    <Proxy http://127.0.0.1:8000/*>
        Require all granted
    </Proxy>

    # -----------------------------------------------------------------
    #  Sécurité
    # -----------------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        # Le cookie de session est déjà HttpOnly/SameSite côté application ;
        # cette directive ajoute Secure au cas où SESSION_COOKIE_SECURE serait
        # resté à false dans .env.
        Header always edit Set-Cookie ^(.*)$ "$1; Secure"
    </IfModule>

    # Le corps des uploads de médias peut être volumineux
    LimitRequestBody 104857600
</VirtualHost>
