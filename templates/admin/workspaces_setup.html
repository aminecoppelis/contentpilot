{% extends "base.html" %}
{% block title %}{{ t('adm.ws.title') }} · {{ t('nav.admin') }}{% endblock %}
{% block content %}
<section class="card">
  <h1 style="font-size:28px;margin:0 0 8px">{{ t('adm.ws.title') }}</h1>
  <p class="subtitle" style="color:var(--muted);margin:0 0 20px">{{ t('adm.ws.desc') }}</p>
  {% if error %}
    <div class="alert alert-error"><b>{{ message }}</b><br><code style="font-size:12px">{{ error }}</code></div>
  {% else %}
    <div class="alert alert-info">{{ message }}</div>
  {% endif %}
  <a class="btn-primary" href="/app/admin/settings">{{ t('adm.ws.back') }}</a>
</section>
{% endblock %}
