<section class="card prospectingCard" aria-labelledby="prospecting-campaigns">
  <h2 id="prospecting-campaigns">{{ t('prospecting.new_campaign') }}</h2>
  <form method="post" class="prospectingForm" action="/app/prospecting/campaigns">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="campaign-target">{{ t('prospecting.campaign_target') }}</label>
    <textarea id="campaign-target" name="target" rows="3" maxlength="1200" placeholder="{{ t('prospecting.target_example') }}" required>{{ brief.target|default('') }}</textarea>
    <label for="campaign-goal">{{ t('prospecting.goal') }}</label>
    <textarea id="campaign-goal" name="goal" rows="2" maxlength="1200" required>{{ brief.goal|default('') }}</textarea>
    <label for="campaign-offer">{{ t('prospecting.offer') }}</label>
    <textarea id="campaign-offer" name="offer" rows="2" maxlength="1200" required>{{ brief.offer|default('') }}</textarea>
    <label for="campaign-name">{{ t('prospecting.campaign_name') }}</label>
    <input id="campaign-name" name="name" type="text" maxlength="120" value="{{ brief.name|default('') }}" required>
    <div class="prospectingActions">
      <button class="btn" type="submit" formnovalidate formaction="/app/prospecting/campaigns/draft">{{ t('prospecting.draft_campaign') }}</button>
      <button class="btn btn-primary" type="submit">{{ t('prospecting.create') }}</button>
    </div>
  </form>
</section>
